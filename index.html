<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Markdown Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link id="hljsTheme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-2: #f0f2f8;
      --surface-3: #e7ebf5;
      --text: #141824;
      --text-muted: #5b647a;
      --border: #dfe4f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: rgba(79, 70, 229, 0.12);
      --success: #059669;
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.12);
      --warning: #d97706;
      --drop-bg: rgba(79, 70, 229, 0.08);
      --shadow: 0 10px 30px rgba(20, 24, 36, 0.06);
      --radius: 14px;
      --radius-sm: 9px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --split-left: 50%;
    }

    [data-theme="dark"] {
      --bg: #0c0f17;
      --surface: #141925;
      --surface-2: #1b2232;
      --surface-3: #232c40;
      --text: #eef2ff;
      --text-muted: #98a2b3;
      --border: #263046;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-soft: rgba(99, 102, 241, 0.18);
      --success: #10b981;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.16);
      --warning: #fbbf24;
      --drop-bg: rgba(99, 102, 241, 0.14);
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body.resizing-panes {
      cursor: col-resize;
      user-select: none;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button, input, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 0.875rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--surface-3);
      border-color: var(--text-muted);
    }

    button:active:not(:disabled) {
      transform: scale(0.985);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button.danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #ffffff;
    }

    button.sm {
      padding: 5px 9px;
      font-size: 0.8rem;
      border-radius: 7px;
    }

    button.full {
      width: 100%;
    }

    input[type="text"],
    input[type="number"] {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 11px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    input.compact {
      padding: 6px 9px;
      font-size: 0.8rem;
      border-radius: 7px;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: var(--surface);
    }

    input[type="file"].hidden-file {
      display: none;
    }

    /* Header (Reference Style) */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      width: 100%;
      max-width: 100%;
      overflow-x: clip;
      backdrop-filter: blur(12px);
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .header-inner {
      max-width: 1560px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      max-width: 100%;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #9333ea);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.05rem;
      flex-shrink: 0;
      box-shadow: 0 4px 12px var(--accent-soft);
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 600;
      font-family: var(--mono);
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .file-badge {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .file-badge:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      min-width: 0;
      max-width: 100%;
    }

    .header-actions > button {
      height: 36px;
      padding: 0 12px;
      font-size: 0.875rem;
      white-space: nowrap;
    }

    #themeToggleBtn {
      display: inline-grid;
      align-items: center;
      justify-items: center;
    }

    .theme-label-light,
    .theme-label-dark {
      grid-area: 1 / 1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    html[data-theme="light"] .theme-label-light { visibility: hidden; }
    html[data-theme="dark"] .theme-label-dark { visibility: hidden; }

    .btn-group {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--surface-2);
      padding: 2px;
      gap: 2px;
      height: 36px;
      align-items: stretch;
      max-width: 100%;
    }

    .btn-group button {
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 0 12px;
      height: 100%;
      font-size: 0.875rem;
      background: transparent;
    }

    .btn-group button:hover:not(:disabled):not(.active) {
      background: var(--surface-3);
      border-color: transparent;
    }

    .btn-group button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    /* Main Container & Card Workspace */
    .container {
      flex: 1;
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: var(--split-left) 12px 1fr;
      min-height: 0;
      position: relative;
      max-width: 100%;
    }

    .workspace.mode-editor {
      grid-template-columns: 1fr;
    }

    .workspace.mode-editor .preview-pane,
    .workspace.mode-editor .split-resizer {
      display: none;
    }

    .workspace.mode-preview {
      grid-template-columns: 1fr;
    }

    .workspace.mode-preview .editor-pane,
    .workspace.mode-preview .split-resizer {
      display: none;
    }

    .split-resizer {
      cursor: col-resize;
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }

    .split-resizer::after {
      content: "";
      width: 4px;
      height: 44px;
      border-radius: 999px;
      background: var(--border);
      transition: background 0.15s ease, height 0.15s ease;
    }

    .split-resizer:hover::after,
    body.resizing-panes .split-resizer::after {
      background: var(--accent);
      height: 64px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .card-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 0.96rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
    }

    .format-mini-bar {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }

    .format-mini-bar button {
      padding: 4px 8px;
      font-size: 0.78rem;
      border-radius: 7px;
      background: var(--surface-2);
    }

    .format-mini-bar button:hover:not(:disabled) {
      background: var(--surface-3);
      border-color: var(--text-muted);
    }

    .fmt-h1 { font-weight: 900; font-size: 0.88rem; letter-spacing: -0.03em; }
    .fmt-h2 { font-weight: 800; font-size: 0.8rem; letter-spacing: -0.02em; }
    .fmt-h3 { font-weight: 700; font-size: 0.74rem; color: var(--text-muted); }
    .fmt-bold { font-weight: 900; font-size: 0.84rem; }
    .fmt-italic { font-style: italic; font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 0.86rem; }
    .fmt-strike { text-decoration: line-through; font-weight: 600; }
    .fmt-code { font-family: var(--mono); font-weight: 700; font-size: 0.74rem; }
    .fmt-quote { font-style: italic; font-family: Georgia, "Times New Roman", serif; }

    .editor-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Table Size Picker Popover */
    .table-picker {
      display: none;
      position: absolute;
      top: 56px;
      left: 16px;
      z-index: 35;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 11px 12px;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
    }

    .table-picker.open {
      display: flex;
    }

    .table-picker input[type="number"] {
      width: 58px;
      padding: 5px 7px;
      font-size: 0.8rem;
      border-radius: 7px;
    }

    /* Find & Replace Bar */
    .find-bar {
      display: none;
      padding: 9px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .find-bar.open {
      display: flex;
    }

    .find-bar input {
      background: var(--surface);
      min-width: 135px;
    }

    .find-bar button {
      background: var(--surface);
    }

    .find-bar button:hover:not(:disabled) {
      background: var(--surface-3);
    }

    /* Heading Outline Bar */
    .outline-bar {
      display: none;
      padding: 9px 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      flex-shrink: 0;
    }

    .outline-bar.open {
      display: flex;
    }

    .outline-chip {
      padding: 4px 10px;
      font-size: 0.76rem;
      font-weight: 500;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
    }

    .outline-chip:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .outline-chip.lvl-2 { margin-left: 8px; }
    .outline-chip.lvl-3 { margin-left: 16px; color: var(--text-muted); }

    #editor {
      flex: 1;
      width: 100%;
      resize: none;
      border: none;
      outline: none;
      padding: 18px 20px;
      font-family: var(--mono);
      font-size: 0.9rem;
      line-height: 1.65;
      background: var(--surface);
      color: var(--text);
      -webkit-overflow-scrolling: touch;
    }

    #preview {
      flex: 1;
      overflow-y: auto;
      padding: 22px 28px;
      background: var(--surface);
      line-height: 1.65;
      -webkit-overflow-scrolling: touch;
    }

    .fallback-banner {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin-bottom: 16px;
    }

    /* Drag & Drop Overlay */
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: var(--drop-bg);
      backdrop-filter: blur(4px);
      border: 2px dashed var(--accent);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 55;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      pointer-events: none;
    }

    body.dragging .drop-overlay {
      display: flex;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(12, 15, 23, 0.55);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.hidden {
      display: none;
    }

    .modal-dialog {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 460px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .modal-dialog.sm {
      max-width: 390px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      margin: 0;
      font-size: 0.96rem;
      font-weight: 700;
    }

    .modal-body-text {
      margin: 0;
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .field > label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .data-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .dropzone {
      flex: 1;
      border: 2px dashed var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      padding: 16px 12px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .dropzone.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .export-box {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
    }

    .export-actions-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 2px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding-top: 4px;
    }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 99;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 360px;
    }

    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.85rem;
      box-shadow: var(--shadow);
      animation: fadeIn 0.16s ease;
    }

    .toast.success { border-left-color: var(--success); }
    .toast.error { border-left-color: var(--danger); }
    .toast.warning { border-left-color: var(--warning); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hidden {
      display: none !important;
    }

    /* Rendered Markdown Styles */
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin-top: 22px;
      margin-bottom: 10px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.015em;
      scroll-margin-top: 12px;
    }

    .markdown-body > :first-child {
      margin-top: 0;
    }

    .markdown-body h1 {
      font-size: 1.9em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body h2 {
      font-size: 1.45em;
      padding-bottom: 0.25em;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body h3 { font-size: 1.2em; }
    .markdown-body h4 { font-size: 1em; }

    .markdown-body p,
    .markdown-body blockquote,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body table,
    .markdown-body pre {
      margin-bottom: 16px;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 24px;
    }

    .markdown-body li + li {
      margin-top: 4px;
    }

    .markdown-body ul.contains-task-list {
      list-style: none;
      padding-left: 4px;
    }

    .markdown-body li.task-list-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .markdown-body input[type="checkbox"] {
      margin-top: 5px;
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .markdown-body blockquote {
      padding: 8px 16px;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    .markdown-body code {
      font-family: var(--mono);
      font-size: 0.87em;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
    }

    .markdown-body pre {
      position: relative;
      background: var(--surface-2);
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      border: 1px solid var(--border);
    }

    .markdown-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 0.88em;
      line-height: 1.55;
    }

    .copy-code-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 9px;
      font-size: 0.74rem;
      border-radius: 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      opacity: 0.9;
    }

    .copy-code-btn:hover:not(:disabled) {
      opacity: 1;
      background: var(--surface-3);
      border-color: var(--accent);
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }

    .markdown-body th {
      background: var(--surface-2);
      font-weight: 700;
    }

    .markdown-body tr:nth-child(even) td {
      background: color-mix(in srgb, var(--surface-2) 45%, var(--surface));
    }

    .markdown-body img {
      max-width: 100%;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    @media (max-width: 820px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow-x: clip;
        overflow-y: auto;
      }
      .workspace {
        grid-template-columns: 1fr;
        grid-template-rows: 48vh 54vh;
        gap: 14px;
      }
      .workspace .split-resizer {
        display: none;
      }
      .workspace.mode-editor,
      .workspace.mode-preview {
        grid-template-rows: 75vh;
      }
      #preview {
        padding: 18px 16px;
      }
    }

    @media (max-width: 720px) {
      .header-inner {
        padding: 12px 18px;
        gap: 10px;
      }
      .brand {
        gap: 8px;
        flex: 1 1 100%;
      }
      .brand-logo {
        width: 32px;
        height: 32px;
        font-size: 0.92rem;

      }

      }
      .data-grid {
        grid-template-columns: 1fr;
      }
    }

    @media print {
      body {
        height: auto;
        overflow: visible;
        background: #fff;
        color: #000;
      }
      .app-header,
      .editor-pane,
      .card-header,
      .outline-bar,
      .copy-code-btn,
      .drop-overlay,
      .modal-backdrop,
      .toast-container,
      .split-resizer {
        display: none !important;
      }
      .container,
      .workspace {
        display: block;
        padding: 0;
        margin: 0;
        max-width: none;
      }
      .card {
        border: none;
        box-shadow: none;
        border-radius: 0;
      }
      #preview {
        overflow: visible;
        padding: 0;
        background: #fff;
      }
    }
  </style>
</head>
<body>
  <div class="drop-overlay">Drop a .md or .txt file to import</div>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-logo">✍️</div>
        <div class="brand-title">Live Markdown Editor</div>
        <span id="fileNameBadge" class="badge file-badge" title="Click to rename document">untitled.md</span>
      </div>

      <div class="header-actions">
        <div class="btn-group" aria-label="View mode">
          <button id="modeSplitBtn" type="button" class="active">Split</button>
          <button id="modeEditorBtn" type="button">Editor</button>
          <button id="modePreviewBtn" type="button">Preview</button>
        </div>

        <button id="printBtn" type="button" data-export="print" title="Print or export as PDF">🖨️ Print</button>

        <button id="openDataModalBtn" class="primary" type="button" onclick="openDataModal()">
          📂 Data Management
        </button>

        <button id="themeToggleBtn" type="button" title="Toggle light/dark theme" aria-label="Toggle light/dark theme">
          <span class="theme-label-light">☀️ Light</span>
          <span class="theme-label-dark">🌙 Dark</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="workspace" class="workspace">
      <section class="card editor-pane">
        <div class="card-header">
          <h2 class="card-title">📝 Markdown Source</h2>
          <div class="format-mini-bar">
            <button type="button" id="newDocBtn" title="Reset Document">New</button>
            <button type="button" id="undoBtn" title="Undo Snapshot (Ctrl/Cmd+Z)" disabled>Undo</button>
            <button type="button" id="redoBtn" title="Redo Snapshot (Ctrl/Cmd+Shift+Z)" disabled>Redo</button>
            <button type="button" data-heading="#" title="Heading 1"><span class="fmt-h1">H1</span></button>
            <button type="button" data-heading="##" title="Heading 2 / Subheading"><span class="fmt-h2">H2</span></button>
            <button type="button" data-heading="###" title="Heading 3 / Subheading"><span class="fmt-h3">H3</span></button>
            <button type="button" data-wrap="**" title="Bold (Ctrl/Cmd+B)"><span class="fmt-bold">B</span></button>
            <button type="button" data-wrap="*" title="Italic (Ctrl/Cmd+I)"><span class="fmt-italic">I</span></button>
            <button type="button" data-wrap="~~" title="Strikethrough"><span class="fmt-strike">S</span></button>
            <button type="button" data-wrap="`" title="Inline Code"><span class="fmt-code">&lt;/&gt;</span></button>
            <button type="button" data-action="link" title="Insert Link">🔗 Link</button>
            <button type="button" data-action="image" title="Insert Image">🖼️ Image</button>
            <button type="button" id="tablePickerBtn" title="Insert Table">⊞ Table ▾</button>
            <button type="button" data-prefix="> " title="Blockquote"><span class="fmt-quote">“Quote”</span></button>
            <button type="button" data-prefix="- " title="Bullet List">• List</button>
            <button type="button" data-prefix="- [ ] " title="Task Checkbox">☑ Task</button>
            <button type="button" data-action="codeblock" title="Insert Fenced Code Block"><span class="fmt-code">{ }</span></button>
            <button type="button" id="findToggleBtn" title="Find & Replace (Ctrl/Cmd+F)">Find</button>
            <button type="button" id="syncToggleBtn" title="Toggle synchronized scrolling">Sync: On</button>
          </div>
          <div class="editor-meta">
            <span id="cursorPos" class="badge">Ln 1, Col 1</span>
            <span id="stats" class="badge">0 lines · 0 words · 0 chars</span>
          </div>
        </div>

        <div id="tablePicker" class="table-picker" aria-label="Select table size">
          <label for="tableRowsInput">Rows</label>
          <input id="tableRowsInput" class="compact" type="number" min="1" max="20" value="2" />
          <label for="tableColsInput">Cols</label>
          <input id="tableColsInput" class="compact" type="number" min="1" max="12" value="2" />
          <button id="insertTableBtn" type="button" class="sm primary">Insert</button>

        <div id="findBar" class="find-bar" aria-label="Find and Replace">

          <input id="replaceInput" class="compact" type="text" placeholder="Replace with..." />
          <button id="findPrevBtn" class="sm" type="button">Prev</button>
          <button id="findNextBtn" class="sm" type="button">Next</button>

          <button id="replaceAllBtn" class="sm" type="button">Replace All</button>

        <textarea id="editor" placeholder="Type or paste Markdown here, or drag and drop a .md file anywhere..."></textarea>
