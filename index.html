<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Markdown Editor</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link id="hljsTheme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --surface-2: #f0f2f8;
      --surface-3: #e7ebf5;
      --surface-alt: #f0f2f8;
      --text: #141824;
      --text-muted: #5b647a;
      --muted: #5b647a;
      --border: #dfe4f0;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: rgba(79, 70, 229, 0.12);
      --code-bg: #f0f2f8;
      --blockquote-border: #c7d0e6;
      --drop-bg: rgba(79, 70, 229, 0.08);
      --shadow: 0 10px 30px rgba(20, 24, 36, 0.06);
      --radius: 14px;
      --radius-sm: 9px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --split-left: 50%;
    }

    [data-theme="dark"],
    :root[data-theme="dark"] {
      --bg: #0c0f17;
      --surface: #141925;
      --surface-2: #1b2232;
      --surface-3: #232c40;
      --surface-alt: #1b2232;
      --text: #eef2ff;
      --text-muted: #98a2b3;
      --muted: #98a2b3;
      --border: #263046;
      --accent: #6366f1;
      --accent-hover: #818cf8;
      --accent-soft: rgba(99, 102, 241, 0.18);
      --code-bg: #1b2232;
      --blockquote-border: #384666;
      --drop-bg: rgba(99, 102, 241, 0.14);
      --shadow: 0 14px 36px rgba(0, 0, 0, 0.35);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body.resizing-panes {
      cursor: col-resize;
      user-select: none;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    /* Top Toolbar */
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      min-height: 56px;
      padding: 8px 18px;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.015em;
      min-width: 0;
    }

    .brand::before {
      content: "✍️";
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #9333ea);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 0.95rem;
      flex-shrink: 0;
      box-shadow: 0 4px 12px var(--accent-soft);
    }

    .file-badge {
      font-size: 0.76rem;
      font-weight: 600;
      font-family: var(--mono);
      color: var(--text-muted);
      background: var(--surface-2);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .file-badge:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-group {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--surface-2);
      padding: 2px;
      gap: 2px;
    }

    .btn-group button {
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 0.8rem;
      background: transparent;
    }

    .btn-group button:hover:not(:disabled):not(.active) {
      background: var(--surface-3);
      border-color: transparent;
    }

    .btn-group button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button, .btn-label {
      font-size: 0.82rem;
      font-weight: 500;
      padding: 6px 11px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled), .btn-label:hover {
      background: var(--surface-3);
      border-color: var(--text-muted);
    }

    button:active:not(:disabled), .btn-label:active {
      transform: scale(0.985);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* Collapsible Import / Export Dropdown */
    .menu-dropdown {
      position: relative;
      display: inline-block;
    }

    .menu-panel {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 205px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 6px;
      z-index: 40;
      flex-direction: column;
      gap: 3px;
    }

    .menu-dropdown.open .menu-panel {
      display: flex;
    }

    .menu-section-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 5px 9px 2px;
    }

    .menu-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0;
    }

    .menu-item {
      width: 100%;
      justify-content: flex-start;
      background: transparent;
      border-color: transparent;
      border-radius: 7px;
      padding: 7px 9px;
      font-size: 0.82rem;
    }

    .menu-item:hover {
      background: var(--surface-2);
      border-color: var(--border);
    }

    input[type="file"] {
      display: none;
    }

    /* Split Workspace */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: var(--split-left) 6px 1fr;
      min-height: 0;
      position: relative;
      background: var(--bg);
    }

    main.mode-editor {
      grid-template-columns: 1fr;
    }

    main.mode-editor .preview-pane,
    main.mode-editor .split-resizer {
      display: none;
    }

    main.mode-preview {
      grid-template-columns: 1fr;
    }

    main.mode-preview .editor-pane,
    main.mode-preview .split-resizer {
      display: none;
    }

    .split-resizer {
      background: var(--border);
      cursor: col-resize;
      position: relative;
      z-index: 20;
      transition: background 0.15s ease;
      touch-action: none;
    }

    .split-resizer:hover,
    body.resizing-panes .split-resizer {
      background: var(--accent);
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      overflow: hidden;
      position: relative;
      background: var(--surface);
    }

    .pane-header {
      padding: 10px 14px;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .format-mini-bar {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      text-transform: none;
      letter-spacing: normal;
    }

    .format-mini-bar button {
      padding: 4px 8px;
      font-size: 0.76rem;
      border-radius: 7px;
      background: var(--surface-2);
    }

    .format-mini-bar button:hover:not(:disabled) {
      background: var(--surface-3);
      border-color: var(--text-muted);
    }

    /* Styled formatting glyphs inside toolbar buttons */
    .fmt-h1 {
      font-weight: 900;
      font-size: 0.88rem;
      letter-spacing: -0.03em;
    }

    .fmt-h2 {
      font-weight: 800;
      font-size: 0.8rem;
      letter-spacing: -0.02em;
    }

    .fmt-h3 {
      font-weight: 700;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .fmt-bold {
      font-weight: 900;
      font-size: 0.84rem;
    }

    .fmt-italic {
      font-style: italic;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      font-size: 0.86rem;
    }

    .fmt-strike {
      text-decoration: line-through;
      font-weight: 600;
    }

    .fmt-code {
      font-family: var(--mono);
      font-weight: 700;
      font-size: 0.74rem;
    }

    .fmt-quote {
      font-style: italic;
      font-family: Georgia, "Times New Roman", serif;
    }

    .editor-meta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 0.72rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    /* Table Size Picker Popover */
    .table-picker {
      display: none;
      position: absolute;
      top: 52px;
      left: 14px;
      z-index: 35;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 11px 12px;
      align-items: center;
      gap: 8px;
      text-transform: none;
      letter-spacing: normal;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text);
    }

    .table-picker.open {
      display: flex;
    }

    .table-picker input[type="number"] {
      width: 58px;
      padding: 5px 7px;
      font-size: 0.8rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .table-picker input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
      background: var(--surface);
    }

    .table-picker button {
      padding: 5px 10px;
      font-size: 0.78rem;
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .table-picker button:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    /* Find & Replace Bar */
    .find-bar {
      display: none;
      padding: 8px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .find-bar.open {
      display: flex;
    }

    .find-bar input {
      font-size: 0.8rem;
      padding: 6px 9px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      min-width: 135px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .find-bar input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .find-bar button {
      padding: 5px 9px;
      font-size: 0.78rem;
      border-radius: 7px;
      background: var(--surface);
    }

    .find-bar button:hover:not(:disabled) {
      background: var(--surface-3);
    }

    .find-count {
      font-size: 0.74rem;
      font-family: var(--mono);
      font-weight: 600;
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }

    /* Heading Outline Bar */
    .outline-bar {
      display: none;
      padding: 8px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .outline-bar.open {
      display: flex;
    }

    .outline-chip {
      padding: 4px 10px;
      font-size: 0.76rem;
      font-weight: 500;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .outline-chip:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .outline-chip.lvl-2 {
      margin-left: 8px;
    }

    .outline-chip.lvl-3 {
      margin-left: 16px;
      color: var(--text-muted);
    }

    #editor {
      flex: 1;
      width: 100%;
      resize: none;
      border: none;
      outline: none;
      padding: 18px 20px;
      font-family: var(--mono);
      font-size: 0.9rem;
      line-height: 1.65;
      background: var(--surface);
      color: var(--text);
      -webkit-overflow-scrolling: touch;
    }

    #preview {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px;
      background: var(--bg);
      line-height: 1.65;
      -webkit-overflow-scrolling: touch;
    }

    .fallback-banner {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    /* Drag & Drop Overlay */
    .drop-overlay {
      position: fixed;
      inset: 0;
      background: var(--drop-bg);
      backdrop-filter: blur(4px);
      border: 2px dashed var(--accent);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent);
      pointer-events: none;
    }

    body.dragging .drop-overlay {
      display: flex;
    }

    /* Rendered Markdown Styles */
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin-top: 22px;
      margin-bottom: 10px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: -0.015em;
      scroll-margin-top: 12px;
    }

    .markdown-body > :first-child {
      margin-top: 0;
    }

    .markdown-body h1 {
      font-size: 1.9em;
      padding-bottom: 0.3em;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body h2 {
      font-size: 1.45em;
      padding-bottom: 0.25em;
      border-bottom: 1px solid var(--border);
    }

    .markdown-body h3 { font-size: 1.2em; }
    .markdown-body h4 { font-size: 1em; }

    .markdown-body p,
    .markdown-body blockquote,
    .markdown-body ul,
    .markdown-body ol,
    .markdown-body table,
    .markdown-body pre {
      margin-bottom: 16px;
    }

    .markdown-body a {
      color: var(--accent);
      text-decoration: none;
    }

    .markdown-body a:hover {
      text-decoration: underline;
    }

    .markdown-body ul,
    .markdown-body ol {
      padding-left: 24px;
    }

    .markdown-body li + li {
      margin-top: 4px;
    }

    /* Task / Checkbox List Support */
    .markdown-body ul.contains-task-list {
      list-style: none;
      padding-left: 4px;
    }

    .markdown-body li.task-list-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .markdown-body input[type="checkbox"] {
      margin-top: 5px;
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .markdown-body blockquote {
      padding: 8px 16px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    .markdown-body code {
      font-family: var(--mono);
      font-size: 0.87em;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 6px;
    }

    .markdown-body pre {
      position: relative;
      background: var(--surface);
      padding: 14px 16px;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .markdown-body pre code {
      background: transparent;
      border: none;
      padding: 0;
      font-size: 0.88em;
      line-height: 1.55;
    }

    .copy-code-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 9px;
      font-size: 0.74rem;
      border-radius: 7px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      opacity: 0.9;
    }

    .copy-code-btn:hover:not(:disabled) {
      opacity: 1;
      background: var(--surface-3);
      border-color: var(--accent);
    }

    .markdown-body hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .markdown-body th,
    .markdown-body td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }

    .markdown-body th {
      background: var(--surface-2);
      font-weight: 700;
    }

    .markdown-body tr:nth-child(even) td {
      background: color-mix(in srgb, var(--surface-2) 45%, var(--surface));
    }

    .markdown-body img {
      max-width: 100%;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    @media (max-width: 820px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
      }
      main {
        grid-template-columns: 1fr;
        grid-template-rows: 45vh 55vh;
      }
      main .split-resizer {
        display: none;
      }
      main.mode-editor,
      main.mode-preview {
        grid-template-rows: 75vh;
      }
      .editor-pane {
        border-bottom: 1px solid var(--border);
      }
      #preview {
        padding: 18px 16px;
      }
    }

    @media print {
      body {
        height: auto;
        overflow: visible;
        background: #fff;
        color: #000;
      }
      header,
      .editor-pane,
      .pane-header,
      .outline-bar,
      .copy-code-btn,
      .drop-overlay,
      .split-resizer {
        display: none !important;
      }
      main {
        display: block;
      }
      #preview {
        overflow: visible;
        padding: 0;
        background: #fff;
      }
    }
  </style>
</head>
<body>
  <div class="drop-overlay">Drop a .md or .txt file to import</div>

  <header>
    <div class="brand">
      <span>Live Markdown Editor</span>
      <span id="fileNameBadge" class="file-badge" title="Click to rename document">untitled.md</span>
    </div>

    <div class="toolbar-actions">
      <div class="btn-group" aria-label="View mode">
        <button id="modeSplitBtn" type="button" class="active">Split</button>
        <button id="modeEditorBtn" type="button">Editor</button>
        <button id="modePreviewBtn" type="button">Preview</button>
      </div>

      <button id="themeToggleBtn" type="button" title="Toggle Light / Dark theme">🌙 Dark Mode</button>

      <div class="menu-dropdown" id="ioMenuDropdown">
        <button id="ioMenuToggle" class="primary" type="button" aria-expanded="false" aria-controls="ioMenuPanel">
          Import / Export ▾
        </button>
        <div class="menu-panel" id="ioMenuPanel">
          <span class="menu-section-label">Import</span>
          <label class="btn-label menu-item" for="fileInput">
            Import .md / .txt
          </label>
          <input type="file" id="fileInput" accept=".md,.markdown,.txt,text/markdown,text/plain" />

          <div class="menu-divider"></div>
          <span class="menu-section-label">Export</span>
          <button class="menu-item" type="button" data-export="copy-md">Copy Markdown</button>

      <div class="pane-header">
        <span>Live Preview</span>

        <span>Auto-Saved</span>

      <article id="preview" class="markdown-body"></article>

  <script>
    const STORAGE_KEY = "live_md_viewer_content_v1";
    const STORAGE_FILENAME_KEY = "live_md_viewer_filename_v1";
    const STORAGE_THEME_KEY = "live_md_viewer_theme_v1";

    const DEFAULT_MARKDOWN = `# Notes

Start typing your Markdown here.
`;

    const workspace = document.getElementById("workspace");
    const splitResizer = document.getElementById("splitResizer");
    const editor = document.getElementById("editor");
    const preview = document.getElementById("preview");
    const fileInput = document.getElementById("fileInput");
    const fileNameBadge = document.getElementById("fileNameBadge");
    const stats = document.getElementById("stats");
    const cursorPos = document.getElementById("cursorPos");
    const syncToggleBtn = document.getElementById("syncToggleBtn");
    const modeSplitBtn = document.getElementById("modeSplitBtn");
    const modeEditorBtn = document.getElementById("modeEditorBtn");
    const modePreviewBtn = document.getElementById("modePreviewBtn");
    const ioMenuDropdown = document.getElementById("ioMenuDropdown");
    const ioMenuToggle = document.getElementById("ioMenuToggle");
    const themeToggleBtn = document.getElementById("themeToggleBtn");
    const hljsTheme = document.getElementById("hljsTheme");
    const newDocBtn = document.getElementById("newDocBtn");

    const tablePickerBtn = document.getElementById("tablePickerBtn");
    const tablePicker = document.getElementById("tablePicker");
    const tableRowsInput = document.getElementById("tableRowsInput");
    const tableColsInput = document.getElementById("tableColsInput");
    const insertTableBtn = document.getElementById("insertTableBtn");

    const undoBtn = document.getElementById("undoBtn");
    const redoBtn = document.getElementById("redoBtn");

    const findToggleBtn = document.getElementById("findToggleBtn");
    const findBar = document.getElementById("findBar");
    const findInput = document.getElementById("findInput");
    const replaceInput = document.getElementById("replaceInput");
    const findPrevBtn = document.getElementById("findPrevBtn");
    const findNextBtn = document.getElementById("findNextBtn");
    const replaceOneBtn = document.getElementById("replaceOneBtn");
    const replaceAllBtn = document.getElementById("replaceAllBtn");
    const findCount = document.getElementById("findCount");
    const findCloseBtn = document.getElementById("findCloseBtn");

    const outlineToggleBtn = document.getElementById("outlineToggleBtn");
    const outlineBar = document.getElementById("outlineBar");

    if (typeof window.marked !== "undefined" && typeof window.marked.setOptions === "function") {
      window.marked.setOptions({
        gfm: true,
        breaks: false
      });
    }

    let syncScrollEnabled = true;
    let scrollLockOwner = null;
    let scrollReleaseTimer = null;
    let syncPauseTimer = null;

    function pauseSyncScrollTemporarily(ms = 450) {
      if (!syncScrollEnabled) return () => {};
      const previous = syncScrollEnabled;
      syncScrollEnabled = false;
      clearTimeout(syncPauseTimer);
      syncPauseTimer = setTimeout(() => {
        syncScrollEnabled = previous;
      }, ms);
      return () => {
        clearTimeout(syncPauseTimer);
        syncScrollEnabled = previous;
      };
    }

    // Replaces a text range in editor while preserving native undo where possible and keeping scroll steady
    function replaceEditorRange(start, end, replacement, selectStart = null, selectEnd = null) {
      const prevEditorScrollTop = editor.scrollTop;
      const prevPreviewScrollTop = preview.scrollTop;

      editor.focus();
      editor.setSelectionRange(start, end);

      let usedExecCommand = false;
      if (typeof document.execCommand === "function") {
        try {
          usedExecCommand = document.execCommand("insertText", false, replacement);
        } catch {
          usedExecCommand = false;
        }
      }

      if (!usedExecCommand) {
        if (typeof editor.setRangeText === "function") {
          editor.setRangeText(replacement, start, end, "preserve");
        } else {
          editor.value = editor.value.slice(0, start) + replacement + editor.value.slice(end);
        }
      }

      const finalStart = typeof selectStart === "number" ? selectStart : start + replacement.length;
      const finalEnd = typeof selectEnd === "number" ? selectEnd : finalStart;
      editor.setSelectionRange(finalStart, finalEnd);

      const resumeSync = pauseSyncScrollTemporarily(80);
      editor.scrollTop = prevEditorScrollTop;
      preview.scrollTop = prevPreviewScrollTop;
      renderMarkdown({ preserveScroll: true });
      editor.scrollTop = prevEditorScrollTop;
      preview.scrollTop = prevPreviewScrollTop;
      requestAnimationFrame(() => {
        editor.scrollTop = prevEditorScrollTop;
        preview.scrollTop = prevPreviewScrollTop;
        resumeSync();
      });
    }

    // Split-Pane Resize Logic
    let splitPercent = 50;
    let isResizingSplit = false;

    function setSplitRatio(pct) {
      const clamped = Math.min(82, Math.max(18, Number(pct) || 50));
      splitPercent = clamped;
      document.documentElement.style.setProperty("--split-left", `${clamped}%`);
    }

    splitResizer.addEventListener("pointerdown", (e) => {
      if (window.innerWidth <= 820) return;
      if (workspace.classList.contains("mode-editor") || workspace.classList.contains("mode-preview")) return;
      e.preventDefault();
      isResizingSplit = true;
      splitResizer.setPointerCapture(e.pointerId);
      document.body.classList.add("resizing-panes");
    });

    splitResizer.addEventListener("pointermove", (e) => {
      if (!isResizingSplit) return;
      const rect = workspace.getBoundingClientRect();
      if (rect.width <= 0) return;
      const offsetX = e.clientX - rect.left;
      const pct = (offsetX / rect.width) * 100;
      setSplitRatio(pct);
    });

    function stopResizingSplit() {
      if (!isResizingSplit) return;
      isResizingSplit = false;
      document.body.classList.remove("resizing-panes");
    }

    splitResizer.addEventListener("pointerup", stopResizingSplit);
    splitResizer.addEventListener("pointercancel", stopResizingSplit);
    splitResizer.addEventListener("dblclick", () => setSplitRatio(50));

    // Document Rename Helper
    function renameDocument(newName) {
      const cleaned = String(newName ?? "")
        .trim()
        .replace(/[\\/:*?"<>|]/g, "")
        .slice(0, 100);
      const finalName = cleaned || "untitled.md";
      fileNameBadge.textContent = finalName;
      saveToStorage();
    }

    fileNameBadge.addEventListener("click", () => {
      const current = fileNameBadge.textContent || "untitled.md";
      const next = window.prompt("Rename document:", current);
      if (next !== null) {
        renameDocument(next);
      }
    });

    // Reset / New Document
    newDocBtn.addEventListener("click", () => {
      if (editor.value.trim() && !window.confirm("Start a new document and replace current notes?")) {
        return;
      }
      editor.value = DEFAULT_MARKDOWN;
      editor.scrollTop = 0;
      preview.scrollTop = 0;
      fileNameBadge.textContent = "untitled.md";
      saveToStorage();
      renderMarkdown();
    });

    // Cursor Line & Column Indicator
    function updateCursorPosition() {
      const pos = editor.selectionStart ?? 0;
      const before = editor.value.slice(0, pos);
      const lines = before.split("\n");
      const line = lines.length;
      const col = lines[lines.length - 1].length + 1;
      cursorPos.textContent = `Ln ${line}, Col ${col}`;
    }

    editor.addEventListener("click", updateCursorPosition);
    editor.addEventListener("keyup", updateCursorPosition);
    editor.addEventListener("select", updateCursorPosition);

    // Undo / Redo Snapshot State
    const historyStack = [];
    let historyIndex = -1;
    const MAX_HISTORY = 100;

    function updateHistoryButtons() {
      undoBtn.disabled = historyIndex <= 0;
      redoBtn.disabled = historyIndex >= historyStack.length - 1;
    }

    function pushHistorySnapshot(value = editor.value, selectionStart = editor.selectionStart, selectionEnd = editor.selectionEnd) {
      const current = historyStack[historyIndex];
      if (current && current.value === value) return;

      if (historyIndex < historyStack.length - 1) {
        historyStack.splice(historyIndex + 1);
      }

      historyStack.push({ value, selectionStart, selectionEnd });
      if (historyStack.length > MAX_HISTORY) {
        historyStack.shift();
      } else {
        historyIndex++;
      }
      updateHistoryButtons();
    }

    function applySnapshot(snap) {
      if (!snap) return;
      const prevEditorScrollTop = editor.scrollTop;
      const prevPreviewScrollTop = preview.scrollTop;

      editor.value = snap.value;
      editor.focus();
      editor.selectionStart = snap.selectionStart;
      editor.selectionEnd = snap.selectionEnd;

      const resumeSync = pauseSyncScrollTemporarily(80);
      editor.scrollTop = prevEditorScrollTop;
      preview.scrollTop = prevPreviewScrollTop;

      updateHistoryButtons();
      renderMarkdown({ preserveScroll: true, recordHistory: false });
      editor.scrollTop = prevEditorScrollTop;
      preview.scrollTop = prevPreviewScrollTop;
      requestAnimationFrame(() => {
        editor.scrollTop = prevEditorScrollTop;
        preview.scrollTop = prevPreviewScrollTop;
        resumeSync();
      });
    }

    function undoSnapshot() {
      if (historyIndex <= 0) return;
      historyIndex--;
      applySnapshot(historyStack[historyIndex]);
    }

    function redoSnapshot() {
      if (historyIndex >= historyStack.length - 1) return;
      historyIndex++;
      applySnapshot(historyStack[historyIndex]);
    }

    undoBtn.addEventListener("click", undoSnapshot);
    redoBtn.addEventListener("click", redoSnapshot);

    // Light / Dark Mode Switch
    function setPreviewTheme(theme) {
      const mode = theme === "dark" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", mode);
      themeToggleBtn.textContent = mode === "dark" ? "☀️ Light Mode" : "🌙 Dark Mode";
      try {
        localStorage.setItem(STORAGE_THEME_KEY, mode);
      } catch {
        // Ignore storage errors
      }
      if (hljsTheme) {
        hljsTheme.href = mode === "dark"
          ? "https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css"
          : "https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css";
      }
    }

    themeToggleBtn.addEventListener("click", () => {
      const current = document.documentElement.getAttribute("data-theme") || "light";
      setPreviewTheme(current === "dark" ? "light" : "dark");
    });

    // Collapsible Import / Export Dropdown
    function setIoMenuOpen(open) {
      ioMenuDropdown.classList.toggle("open", open);
      ioMenuToggle.setAttribute("aria-expanded", String(open));
    }

    ioMenuToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      const isOpen = ioMenuDropdown.classList.contains("open");
      setIoMenuOpen(!isOpen);
    });

    function setTablePickerOpen(open) {
      tablePicker.classList.toggle("open", open);
      if (open) {
        tableRowsInput.focus();
      }
    }

    tablePickerBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      setTablePickerOpen(!tablePicker.classList.contains("open"));
    });

    window.addEventListener("resize", () => {
      stopResizingSplit();
    });

    document.addEventListener("click", (e) => {
      if (!ioMenuDropdown.contains(e.target)) {
        setIoMenuOpen(false);
      }
      if (!tablePicker.contains(e.target) && e.target !== tablePickerBtn) {
        setTablePickerOpen(false);
      }
    });

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatFallbackInline(text) {
      let out = escapeHtml(text);
      out = out.replace(/`([^`\n]+)`/g, (_, code) => `<code>${code}</code>`);
      out = out.replace(/\*\*\*([^*\n]+)\*\*\*/g, (_, inner) => `<strong><em>${inner}</em></strong>`);
      out = out.replace(/\*\*([^*\n]+)\*\*/g, (_, inner) => `<strong>${inner}</strong>`);
      out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, (_, pre, inner) => `${pre}<em>${inner}</em>`);
      out = out.replace(/~~([^~\n]+)~~/g, (_, inner) => `<del>${inner}</del>`);
      return out;
    }

    function fallbackMarkdownToHtml(raw) {
      const lines = raw.split("\n");
      const html = [];
      let inCodeBlock = false;
      let inList = false;

      for (const line of lines) {
        if (/^\s*(`{3,}|~{3,})/.test(line)) {
          if (inList) {
            html.push("</ul>");
            inList = false;
          }
          if (!inCodeBlock) {
            inCodeBlock = true;
            html.push("<pre><code>");
          } else {
            inCodeBlock = false;
            html.push("</code></pre>");
          }
          continue;
        }

        if (inCodeBlock) {
          html.push(escapeHtml(line) + "\n");
          continue;
        }

        const headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
        if (headingMatch) {
          if (inList) {
            html.push("</ul>");
            inList = false;
          }
          const level = headingMatch[1].length;
          html.push(`<h${level}>${formatFallbackInline(headingMatch[2])}</h${level}>`);
          continue;
        }

        const taskMatch = line.match(/^\s*[-*+]\s+\[([ xX])\]\s+(.*)$/);
        if (taskMatch) {
          if (!inList) {
            html.push('<ul class="contains-task-list">');
            inList = true;
          }
          const checked = taskMatch[1].toLowerCase() === "x" ? " checked" : "";
          html.push(
            `<li class="task-list-item"><input type="checkbox"${checked} /><span>${formatFallbackInline(taskMatch[2])}</span></li>`
          );
          continue;
        }

        const listMatch = line.match(/^\s*[-*+]\s+(.*)$/);
        if (listMatch) {
          if (!inList) {
            html.push("<ul>");
            inList = true;
          }
          html.push(`<li>${formatFallbackInline(listMatch[1])}</li>`);
          continue;
        }

        if (inList) {
          html.push("</ul>");
          inList = false;
        }

        if (line.trim() === "") {
          continue;
        }

        html.push(`<p>${formatFallbackInline(line)}</p>`);
      }

      if (inList) html.push("</ul>");
      if (inCodeBlock) html.push("</code></pre>");
      return html.join("\n");
    }

    function updateStats(text) {
      const lines = text ? text.split("\n").length : 0;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      stats.textContent = `${lines} lines · ${words} words · ${chars} chars`;
    }

    function saveToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, editor.value);
        localStorage.setItem(STORAGE_FILENAME_KEY, fileNameBadge.textContent || "untitled.md");
      } catch {
        // Ignore storage quota or privacy mode errors
      }
    }

    // Shared helper to scan lines while tracking fenced code blocks
    function scanNonFencedLines(markdown, visitor) {
      const lines = markdown.split("\n");
      let activeFence = null;
      let activeFenceLen = 0;

      lines.forEach((line, lineIndex) => {
        const fenceMatch = line.match(/^\s*(`{3,}|~{3,})(.*)$/);
        if (fenceMatch) {
          const marker = fenceMatch[1][0];
          const len = fenceMatch[1].length;
          const trailing = fenceMatch[2].trim();

          if (!activeFence) {
            activeFence = marker;
            activeFenceLen = len;
            return;
          }
          if (marker === activeFence && len >= activeFenceLen && trailing === "") {
            activeFence = null;
            activeFenceLen = 0;
            return;
          }
        }

        if (activeFence) return;
        visitor(line, lineIndex);
      });
    }

    function getTaskLineIndices(markdown) {
      const indices = [];
      scanNonFencedLines(markdown, (line, lineIndex) => {
        if (/^\s*(?:[-*+]|\d+\.)\s+\[[ xX]\]\s+/.test(line)) {
          indices.push(lineIndex);
        }
      });
      return indices;
    }

    function stripInlineMarkdown(text) {
      return text
        .replace(/!\[([^\]]*)\]\([^)]*\)/g, "$1")
        .replace(/\[([^\]]+)\]\([^)]*\)/g, "$1")
        .replace(/`([^`\n]+)`/g, "$1")
        .replace(/\*\*\*([^*\n]+)\*\*\*/g, "$1")
        .replace(/\*\*([^*\n]+)\*\*/g, "$1")
        .replace(/\*([^*\n]+)\*/g, "$1")
        .replace(/~~([^~\n]+)~~/g, "$1")
        .trim();
    }

    // Heading Outline & Jump
    function extractHeadings(markdown) {
      const headings = [];
      scanNonFencedLines(markdown, (line, lineIndex) => {
        const match = line.match(/^(#{1,3})\s+(.+?)\s*#*$/);
        if (match) {
          const rawText = match[2].trim();
          headings.push({
            level: match[1].length,
            text: stripInlineMarkdown(rawText) || rawText,
            lineIndex
          });
        }
      });
      return headings;
    }

    function jumpToHeading(heading, occurrenceIndex = 0) {
      const lines = editor.value.split("\n");
      let charPos = 0;
      for (let i = 0; i < heading.lineIndex && i < lines.length; i++) {
        charPos += lines[i].length + 1;
      }

      const resumeSync = pauseSyncScrollTemporarily(600);
      editor.focus();
      editor.setSelectionRange(charPos, charPos + (lines[heading.lineIndex]?.length || 0));
      updateCursorPosition();
      const lineRatio = lines.length > 1 ? heading.lineIndex / (lines.length - 1) : 0;
      editor.scrollTop = lineRatio * Math.max(0, editor.scrollHeight - editor.clientHeight);

      const selector = `h${heading.level}`;
      const candidates = Array.from(preview.querySelectorAll(selector)).filter(
        (el) => (el.textContent || "").trim() === heading.text
      );
      const targetEl = candidates[occurrenceIndex] || candidates[0];
      if (targetEl) {
        targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }
      requestAnimationFrame(() => resumeSync());
    }

    function renderOutline(markdown) {
      const headings = extractHeadings(markdown);
      outlineBar.replaceChildren();

      if (!headings.length) {
        const empty = document.createElement("span");
        empty.className = "find-count";
        empty.textContent = "No #–### headings found";
        outlineBar.appendChild(empty);
        return;
      }

      const seenCounts = new Map();
      headings.forEach((h) => {
        const key = `${h.level}:${h.text}`;
        const occ = seenCounts.get(key) || 0;
        seenCounts.set(key, occ + 1);

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `outline-chip lvl-${h.level}`;
        btn.textContent = `${"#".repeat(h.level)} ${h.text}`;
        btn.addEventListener("click", () => jumpToHeading(h, occ));
        outlineBar.appendChild(btn);
      });
    }

    outlineToggleBtn.addEventListener("click", () => {
      const open = !outlineBar.classList.contains("open");
      outlineBar.classList.toggle("open", open);
      if (open) renderOutline(editor.value);
    });

    // Copy Code Block Buttons
    function addCopyCodeButtons() {
      preview.querySelectorAll("pre").forEach((pre) => {
        if (pre.querySelector(".copy-code-btn")) return;
        const codeEl = pre.querySelector("code");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "copy-code-btn";
        btn.textContent = "Copy";
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          const text = codeEl ? codeEl.textContent || "" : pre.textContent || "";
          await copyToClipboard(text, btn);
        });
        pre.appendChild(btn);
      });
    }

    function highlightCodeBlocks() {
      if (typeof window.hljs === "undefined" || typeof window.hljs.highlightElement !== "function") {
        return;
      }
      preview.querySelectorAll("pre code").forEach((block) => {
        block.removeAttribute("data-highlighted");
        window.hljs.highlightElement(block);
      });
    }

    function renderMarkdown({ preserveScroll = false, save = true, recordHistory = true } = {}) {
      const prevScrollTop = preserveScroll ? preview.scrollTop : 0;
      const raw = editor.value;
      updateStats(raw);
      updateCursorPosition();
      if (save) saveToStorage();
      if (recordHistory) pushHistorySnapshot(raw, editor.selectionStart, editor.selectionEnd);
      if (outlineBar.classList.contains("open")) renderOutline(raw);
      if (findBar.classList.contains("open")) findInEditor(findInput.value, { keepIndex: true, selectMatch: false });

      try {
        const hasMarked = typeof window.marked !== "undefined" && typeof window.marked.parse === "function";
        const hasPurify = typeof window.DOMPurify !== "undefined" && typeof window.DOMPurify.sanitize === "function";

        let renderedHtml;
        if (hasMarked) {
          const dirtyHtml = window.marked.parse(raw);
          renderedHtml = hasPurify
            ? window.DOMPurify.sanitize(dirtyHtml, {
                ADD_ATTR: ["checked", "disabled", "type", "class"]
              })
            : dirtyHtml;
        } else {
          renderedHtml =
            `<div class="fallback-banner">Offline/CDN fallback active: external Markdown parser did not load. Showing preview.</div>` +
            fallbackMarkdownToHtml(raw);
        }

        preview.innerHTML = renderedHtml;
        highlightCodeBlocks();
        addCopyCodeButtons();

        // Enable task checkboxes in preview and sync back to Markdown source
        const checkboxes = preview.querySelectorAll('li.task-list-item input[type="checkbox"]');
        const taskLines = getTaskLineIndices(raw);

        checkboxes.forEach((cb, idx) => {
          cb.disabled = false;
          cb.dataset.taskIndex = String(idx);
          cb.addEventListener("change", () => {
            const taskIdx = Number(cb.dataset.taskIndex);
            const lineIdx = taskLines[taskIdx];
            if (lineIdx === undefined) return;

            const prevEditorScrollTop = editor.scrollTop;
            const prevPreviewScrollTop = preview.scrollTop;
            const lines = editor.value.split("\n");
            lines[lineIdx] = lines[lineIdx].replace(
              /(\s*(?:[-*+]|\d+\.)\s*\[)[ xX](\])/,
              `$1${cb.checked ? "x" : " "}$2`
            );
            const resumeSync = pauseSyncScrollTemporarily(80);
            editor.value = lines.join("\n");
            renderMarkdown({ preserveScroll: true });
            editor.scrollTop = prevEditorScrollTop;
            preview.scrollTop = prevPreviewScrollTop;
            resumeSync();
          });
        });

        if (preserveScroll) {
          preview.scrollTop = prevScrollTop;
        }
      } catch (err) {
        preview.innerHTML = `<div class="fallback-banner">Preview error: ${escapeHtml(String(err?.message || err))}</div>`;
      }
    }

    // Find & Replace
    let matchPositions = [];
    let currentMatchIdx = -1;

    function selectCurrentMatch() {
      if (!matchPositions.length || currentMatchIdx < 0) {
        findCount.textContent = "0 matches";
        return;
      }
      const [start, end] = matchPositions[currentMatchIdx];
      const resumeSync = pauseSyncScrollTemporarily(150);
      editor.focus();
      editor.setSelectionRange(start, end);
      updateCursorPosition();
      const beforeText = editor.value.slice(0, start);
      const lineNum = beforeText.split("\n").length - 1;
      const totalLines = Math.max(1, editor.value.split("\n").length - 1);
      editor.scrollTop = (lineNum / totalLines) * Math.max(0, editor.scrollHeight - editor.clientHeight);
      findCount.textContent = `${currentMatchIdx + 1} of ${matchPositions.length}`;
      requestAnimationFrame(() => resumeSync());
    }

    function findInEditor(query, { keepIndex = false, selectMatch = true } = {}) {
      matchPositions = [];
      if (!query) {
        currentMatchIdx = -1;
        findCount.textContent = "0 matches";
        return;
      }

      const hay = editor.value.toLowerCase();
      const needle = query.toLowerCase();
      let pos = hay.indexOf(needle);
      while (pos !== -1) {
        matchPositions.push([pos, pos + needle.length]);
        pos = hay.indexOf(needle, pos + needle.length);
      }

      if (!matchPositions.length) {
        currentMatchIdx = -1;
        findCount.textContent = "0 matches";
        return;
      }

      if (!keepIndex || currentMatchIdx < 0 || currentMatchIdx >= matchPositions.length) {
        currentMatchIdx = 0;
      }

      if (selectMatch) {
        selectCurrentMatch();
      } else {
        findCount.textContent = `${currentMatchIdx + 1} of ${matchPositions.length}`;
      }
    }

    function replaceNext() {
      const query = findInput.value;
      if (!query) return;
      if (!matchPositions.length) {
        findInEditor(query);
        if (!matchPositions.length) return;
      }

      const [start, end] = matchPositions[currentMatchIdx];
      const replacement = replaceInput.value;
      replaceEditorRange(
        start,
        end,
        replacement,
        start + replacement.length,
        start + replacement.length
      );
      findInEditor(query, { keepIndex: true, selectMatch: false });
    }

    function replaceAll() {
      const query = findInput.value;
      if (!query) return;
      findInEditor(query, { selectMatch: false });
      if (!matchPositions.length) return;

      const replacement = replaceInput.value;
      const prevEditorScrollTop = editor.scrollTop;
      const prevPreviewScrollTop = preview.scrollTop;
      let updated = editor.value;
      for (let i = matchPositions.length - 1; i >= 0; i--) {
        const [start, end] = matchPositions[i];
        updated = updated.slice(0, start) + replacement + updated.slice(end);
      }
      const resumeSync = pauseSyncScrollTemporarily(80);
      editor.value = updated;
      editor.scrollTop = prevEditorScrollTop;
      preview.scrollTop = prevPreviewScrollTop;
      currentMatchIdx = -1;
      renderMarkdown({ preserveScroll: true });
      editor.scrollTop = prevEditorScrollTop;
      preview.scrollTop = prevPreviewScrollTop;
      findInEditor(query, { selectMatch: false });
      resumeSync();
    }

    function openFindBar(focusInput = true) {
      findBar.classList.add("open");
      if (focusInput) {
        findInput.focus();
        findInput.select();
      }
      findInEditor(findInput.value, { keepIndex: true, selectMatch: false });
    }

    function closeFindBar() {
      findBar.classList.remove("open");
      editor.focus();
    }

    findToggleBtn.addEventListener("click", () => {
      if (findBar.classList.contains("open")) closeFindBar();
      else openFindBar(true);
    });
    findCloseBtn.addEventListener("click", closeFindBar);
    findInput.addEventListener("input", () => findInEditor(findInput.value));
    findInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        if (!matchPositions.length) {
          findInEditor(findInput.value);
          return;
        }
        if (e.shiftKey) {
          currentMatchIdx = (currentMatchIdx - 1 + matchPositions.length) % matchPositions.length;
        } else {
          currentMatchIdx = (currentMatchIdx + 1) % matchPositions.length;
        }
        selectCurrentMatch();
      }
    });
    findNextBtn.addEventListener("click", () => {
      if (!matchPositions.length) return findInEditor(findInput.value);
      currentMatchIdx = (currentMatchIdx + 1) % matchPositions.length;
      selectCurrentMatch();
    });
    findPrevBtn.addEventListener("click", () => {
      if (!matchPositions.length) return findInEditor(findInput.value);
      currentMatchIdx = (currentMatchIdx - 1 + matchPositions.length) % matchPositions.length;
      selectCurrentMatch();
    });
    replaceOneBtn.addEventListener("click", replaceNext);
    replaceAllBtn.addEventListener("click", replaceAll);

    // Formatting & Insert Helpers (scroll-safe)
    function insertHeading(hashes) {
      const start = editor.selectionStart;
      const val = editor.value;
      const lineStart = val.lastIndexOf("\n", start - 1) + 1;
      const lineEndIdx = val.indexOf("\n", start);
      const lineEnd = lineEndIdx === -1 ? val.length : lineEndIdx;
      const currentLine = val.slice(lineStart, lineEnd);

      const stripped = currentLine.replace(/^#{1,6}\s*/, "");
      const placeholder = stripped || "Heading";
      const updatedLine = `${hashes} ${placeholder}`;

      const textStart = lineStart + hashes.length + 1;
      replaceEditorRange(lineStart, lineEnd, updatedLine, textStart, textStart + placeholder.length);
    }

    function prefixCurrentLine(prefix) {
      const start = editor.selectionStart;
      const val = editor.value;
      const lineStart = val.lastIndexOf("\n", start - 1) + 1;
      const lineEndIdx = val.indexOf("\n", start);
      const lineEnd = lineEndIdx === -1 ? val.length : lineEndIdx;
      const currentLine = val.slice(lineStart, lineEnd);

      const content = currentLine.trim() ? currentLine : "item";
      const updatedLine = `${prefix}${content}`;

      const textStart = lineStart + prefix.length;
      replaceEditorRange(lineStart, lineEnd, updatedLine, textStart, textStart + content.length);
    }

    function insertLink() {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const val = editor.value;
      const selected = val.slice(start, end) || "link text";
      const snippet = `[${selected}](https://example.com)`;
      const urlStart = start + selected.length + 3;

      replaceEditorRange(start, end, snippet, urlStart, urlStart + "https://example.com".length);
    }

    function insertImage() {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const val = editor.value;
      const selected = val.slice(start, end) || "alt text";
      const snippet = `![${selected}](https://example.com/image.png)`;
      const urlStart = start + selected.length + 4;

      replaceEditorRange(start, end, snippet, urlStart, urlStart + "https://example.com/image.png".length);
    }

    function insertTable(rows = 2, cols = 2) {
      const r = Math.min(20, Math.max(1, Number(rows) || 2));
      const c = Math.min(12, Math.max(1, Number(cols) || 2));
      const bodyRowCount = Math.max(0, r - 1);

      const headers = Array.from({ length: c }, (_, i) => `Col ${i + 1}`);
      const headerLine = `| ${headers.join(" | ")} |`;
      const dividerLine = `| ${Array.from({ length: c }, () => "---").join(" | ")} |`;
      const bodyLines = Array.from({ length: bodyRowCount }, (_, rowIdx) => {
        const cells = Array.from({ length: c }, (_, colIdx) => `R${rowIdx + 2}C${colIdx + 1}`);
        return `| ${cells.join(" | ")} |`;
      });

      const snippet = bodyLines.length
        ? `${headerLine}\n${dividerLine}\n${bodyLines.join("\n")}\n`
        : `${headerLine}\n${dividerLine}\n`;

      setTablePickerOpen(false);
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      replaceEditorRange(start, end, snippet, start + 2, start + 2 + headers[0].length);
    }

    function submitTablePicker() {
      insertTable(tableRowsInput.value, tableColsInput.value);
    }

    insertTableBtn.addEventListener("click", submitTablePicker);
    tableRowsInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submitTablePicker();
      }
    });
    tableColsInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        submitTablePicker();
      }
    });

    function insertCodeBlock() {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const val = editor.value;
      const selected = val.slice(start, end) || "// code here";
      const snippet = `\`\`\`js\n${selected}\n\`\`\``;
      const codeStart = start + 6;

      replaceEditorRange(start, end, snippet, codeStart, codeStart + selected.length);
    }

    function wrapSelection(prefix, suffix = prefix) {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const value = editor.value;
      const selected = value.slice(start, end);
      const placeholder = selected || "text";
      const replacement = `${prefix}${placeholder}${suffix}`;

      replaceEditorRange(
        start,
        end,
        replacement,
        start + prefix.length,
        start + prefix.length + placeholder.length
      );
    }

    // Smart List Continuation on Enter (bullet, task, and numbered lists)
    function handleListEnter(e) {
      if (e.key !== "Enter" || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return false;

      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      if (start !== end) return false;

      const val = editor.value;
      const lineStart = val.lastIndexOf("\n", start - 1) + 1;
      const lineEndIdx = val.indexOf("\n", start);
      const lineEnd = lineEndIdx === -1 ? val.length : lineEndIdx;
      const currentLine = val.slice(lineStart, lineEnd);

      const taskEmptyMatch = currentLine.match(/^(\s*)([-*+])\s+\[[ xX]\]\s*$/);
      if (taskEmptyMatch) {
        e.preventDefault();
        const cleanedLine = `${taskEmptyMatch[1]}`;
        const pos = lineStart + cleanedLine.length;
        replaceEditorRange(lineStart, lineEnd, cleanedLine, pos, pos);
        return true;
      }

      const taskMatch = currentLine.match(/^(\s*)([-*+])\s+\[[ xX]\]\s+(.*)$/);
      if (taskMatch) {
        e.preventDefault();
        const nextPrefix = `\n${taskMatch[1]}${taskMatch[2]} [ ] `;
        const pos = start + nextPrefix.length;
        replaceEditorRange(start, end, nextPrefix, pos, pos);
        return true;
      }

      const orderedEmptyMatch = currentLine.match(/^(\s*)(\d+)\.\s*$/);
      if (orderedEmptyMatch) {
        e.preventDefault();
        const cleanedLine = `${orderedEmptyMatch[1]}`;
        const pos = lineStart + cleanedLine.length;
        replaceEditorRange(lineStart, lineEnd, cleanedLine, pos, pos);
        return true;
      }

      const orderedMatch = currentLine.match(/^(\s*)(\d+)\.\s+(.*)$/);
      if (orderedMatch) {
        e.preventDefault();
        const nextNum = Number(orderedMatch[2]) + 1;
        const nextPrefix = `\n${orderedMatch[1]}${nextNum}. `;
        const pos = start + nextPrefix.length;
        replaceEditorRange(start, end, nextPrefix, pos, pos);
        return true;
      }

      const bulletEmptyMatch = currentLine.match(/^(\s*)([-*+])\s*$/);
      if (bulletEmptyMatch) {
        e.preventDefault();
        const cleanedLine = `${bulletEmptyMatch[1]}`;
        const pos = lineStart + cleanedLine.length;
        replaceEditorRange(lineStart, lineEnd, cleanedLine, pos, pos);
        return true;
      }

      const bulletMatch = currentLine.match(/^(\s*)([-*+])\s+(.*)$/);
      if (bulletMatch) {
        e.preventDefault();
        const nextPrefix = `\n${bulletMatch[1]}${bulletMatch[2]} `;
        const pos = start + nextPrefix.length;
        replaceEditorRange(start, end, nextPrefix, pos, pos);
        return true;
      }

      return false;
    }

    document.querySelectorAll(".format-mini-bar button[data-heading]").forEach((btn) => {
      btn.addEventListener("click", () => {
        insertHeading(btn.getAttribute("data-heading"));
      });
    });

    document.querySelectorAll(".format-mini-bar button[data-prefix]").forEach((btn) => {
      btn.addEventListener("click", () => {
        prefixCurrentLine(btn.getAttribute("data-prefix"));
      });
    });

    document.querySelectorAll(".format-mini-bar button[data-wrap]").forEach((btn) => {
      btn.addEventListener("click", () => {
        wrapSelection(btn.getAttribute("data-wrap"));
      });
    });

    document.querySelectorAll(".format-mini-bar button[data-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const action = btn.getAttribute("data-action");
        if (action === "link") insertLink();
        if (action === "image") insertImage();
        if (action === "codeblock") insertCodeBlock();
      });
    });

    editor.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "f") {
        e.preventDefault();
        openFindBar(true);
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "b") {
        e.preventDefault();
        wrapSelection("**");
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "i") {
        e.preventDefault();
        wrapSelection("*");
        return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !e.shiftKey && historyIndex > 0) {
        const beforeVal = editor.value;
        requestAnimationFrame(() => {
          if (editor.value === beforeVal && historyIndex > 0) {
            undoSnapshot();
          }
        });
        return;
      }
      if ((e.metaKey || e.ctrlKey) && ((e.key.toLowerCase() === "z" && e.shiftKey) || e.key.toLowerCase() === "y")) {
        e.preventDefault();
        redoSnapshot();
        return;
      }

      if (handleListEnter(e)) return;

      if (e.key === "Tab") {
        e.preventDefault();
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const val = editor.value;

        if (e.shiftKey) {
          const lineStart = val.lastIndexOf("\n", start - 1) + 1;
          const linePrefix = val.slice(lineStart, lineStart + 2);
          if (linePrefix === "  ") {
            replaceEditorRange(
              lineStart,
              lineStart + 2,
              "",
              Math.max(lineStart, start - 2),
              Math.max(lineStart, end - 2)
            );
          }
          return;
        }

        replaceEditorRange(start, end, "  ", start + 2, start + 2);
      }
    });

    // Synchronized scrolling with jitter guard
    function applySyncScroll(source, target, ownerName) {
      if (!syncScrollEnabled) return;
      if (scrollLockOwner && scrollLockOwner !== ownerName) return;

      const maxSource = source.scrollHeight - source.clientHeight;
      const maxTarget = target.scrollHeight - target.clientHeight;
      if (maxSource <= 0 || maxTarget <= 0) return;

      const ratio = source.scrollTop / maxSource;
      const desiredTop = ratio * maxTarget;
      if (Math.abs(target.scrollTop - desiredTop) < 1) return;

      scrollLockOwner = ownerName;
      target.scrollTop = desiredTop;
      clearTimeout(scrollReleaseTimer);
      scrollReleaseTimer = setTimeout(() => {
        scrollLockOwner = null;
      }, 40);
    }

    editor.addEventListener("scroll", () => applySyncScroll(editor, preview, "editor"));
    preview.addEventListener("scroll", () => applySyncScroll(preview, editor, "preview"));

    syncToggleBtn.addEventListener("click", () => {
      syncScrollEnabled = !syncScrollEnabled;
      syncToggleBtn.textContent = `Sync: ${syncScrollEnabled ? "On" : "Off"}`;
    });

    // View mode switcher
    function setViewMode(mode) {
      stopResizingSplit();
      workspace.classList.remove("mode-editor", "mode-preview");
      modeSplitBtn.classList.remove("active");
      modeEditorBtn.classList.remove("active");
      modePreviewBtn.classList.remove("active");

      if (mode === "editor") {
        workspace.classList.add("mode-editor");
        modeEditorBtn.classList.add("active");
      } else if (mode === "preview") {
        workspace.classList.add("mode-preview");
        modePreviewBtn.classList.add("active");
      } else {
        modeSplitBtn.classList.add("active");
      }
    }

    modeSplitBtn.addEventListener("click", () => setViewMode("split"));
    modeEditorBtn.addEventListener("click", () => setViewMode("editor"));
    modePreviewBtn.addEventListener("click", () => setViewMode("preview"));

    function isSupportedTextFile(file) {
      const validExt = /\.(md|markdown|txt)$/i.test(file.name);
      const validMime = file.type.startsWith("text/") || file.type === "";
      return validExt || validMime;
    }

    function loadFile(file) {
      if (!file) return;
      if (!isSupportedTextFile(file)) {
        alert(`"${file.name}" doesn't look like a Markdown or text file (.md, .markdown, .txt).`);
        return;
      }

      const reader = new FileReader();
      reader.onload = (e) => {
        editor.value = String(e.target?.result ?? "");
        editor.scrollTop = 0;
        preview.scrollTop = 0;
        fileNameBadge.textContent = file.name;
        renderMarkdown();
      };
      reader.readAsText(file);
    }

    editor.addEventListener("input", () => renderMarkdown({ preserveScroll: true }));

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      loadFile(file);
      fileInput.value = "";
      setIoMenuOpen(false);
    });

    // Drag and drop support (files only)
    let dragCounter = 0;

    function isFileDrag(e) {
      const types = e.dataTransfer?.types;
      return Boolean(types && Array.from(types).includes("Files"));
    }

    function resetDragState() {
      dragCounter = 0;
      document.body.classList.remove("dragging");
    }

    window.addEventListener("dragenter", (e) => {
      if (!isFileDrag(e)) return;
      e.preventDefault();
      dragCounter++;
      document.body.classList.add("dragging");
    });

    window.addEventListener("dragover", (e) => {
      if (!isFileDrag(e)) return;
      e.preventDefault();
    });

    window.addEventListener("dragleave", (e) => {
      if (!isFileDrag(e) && dragCounter === 0) return;
      dragCounter = Math.max(0, dragCounter - 1);
      if (dragCounter <= 0) {
        resetDragState();
      }
    });

    window.addEventListener("drop", (e) => {
      if (!isFileDrag(e) && !e.dataTransfer?.files?.length) {
        resetDragState();
        return;
      }
      e.preventDefault();
      const file = e.dataTransfer?.files?.[0];
      resetDragState();
      loadFile(file);
    });

    window.addEventListener("blur", () => {
      stopResizingSplit();
      resetDragState();
      setIoMenuOpen(false);
      setTablePickerOpen(false);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        stopResizingSplit();
        resetDragState();
        setIoMenuOpen(false);
        setTablePickerOpen(false);
        if (findBar.classList.contains("open")) closeFindBar();
      }
    });

    // Export Module
    function getExportFileName(extension) {
      const raw = (fileNameBadge.textContent || "document").trim() || "document";
      const base = raw.replace(/\.(md|markdown|txt|html)$/i, "") || "document";
      return `${base}.${extension}`;
    }

    function getCleanPreviewHtml() {
      const clone = preview.cloneNode(true);
      clone.querySelectorAll(".copy-code-btn").forEach((btn) => btn.remove());
      return clone.innerHTML;
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 100);
    }

    function buildStandaloneHtmlDocument(bodyHtml, title) {
      return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>${escapeHtml(title)}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 820px; margin: 40px auto; padding: 0 20px; line-height: 1.65; color: #141824; }
    pre { background: #f0f2f8; padding: 14px; border-radius: 9px; overflow-x: auto; border: 1px solid #dfe4f0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: #f0f2f8; padding: 2px 6px; border-radius: 6px; }
    pre code { background: transparent; padding: 0; border: none; }
    blockquote { border-left: 4px solid #4f46e5; padding: 8px 16px; color: #5b647a; margin: 16px 0; background: #f6f7fb; border-radius: 0 9px 9px 0; }
    table { border-collapse: collapse; width: 100%; margin: 16px 0; }
    th, td { border: 1px solid #dfe4f0; padding: 8px 12px; text-align: left; }
    th { background: #f0f2f8; }
  </style>
</head>
<body>
${bodyHtml}
</body>
</html>`;
    }

    function flashExportLabel(btn, message) {
      const prev = btn.textContent;
      btn.textContent = message;
      setTimeout(() => {
        btn.textContent = prev;
      }, 1200);
    }

    function fallbackExecCommandCopy(text) {
      const temp = document.createElement("textarea");
      temp.value = text;
      temp.setAttribute("readonly", "");
      temp.style.position = "fixed";
      temp.style.top = "0";
      temp.style.left = "0";
      temp.style.opacity = "0";
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      temp.setSelectionRange(0, temp.value.length);

      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch {
        ok = false;
      }

      temp.remove();
      return ok;
    }

    async function copyToClipboard(text, btn) {
      let copied = false;

      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function" && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          copied = true;
        } catch {
          copied = false;
        }
      }

      if (!copied) {
        copied = fallbackExecCommandCopy(text);
      }

      flashExportLabel(btn, copied ? "Copied!" : "Copy failed");
    }

    async function handleExportAction(action, btn) {
      switch (action) {
        case "copy-md":
          await copyToClipboard(editor.value, btn);
          break;
        case "copy-html":
          await copyToClipboard(getCleanPreviewHtml(), btn);
          break;
        case "save-md":
          downloadFile(editor.value, getExportFileName("md"), "text/markdown;charset=utf-8");
          setIoMenuOpen(false);
          break;
        case "save-txt":
          downloadFile(editor.value, getExportFileName("txt"), "text/plain;charset=utf-8");
          setIoMenuOpen(false);
          break;
        case "save-html": {
          const docTitle = getExportFileName("html").replace(/\.html$/i, "");
          const htmlDoc = buildStandaloneHtmlDocument(getCleanPreviewHtml(), docTitle);
          downloadFile(htmlDoc, getExportFileName("html"), "text/html;charset=utf-8");
          setIoMenuOpen(false);
          break;
        }
        case "print":
          setIoMenuOpen(false);
          window.print();
          break;
      }
    }

    document.querySelectorAll("[data-export]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const action = btn.getAttribute("data-export");
        handleExportAction(action, btn);
      });
    });

    // Initial load from localStorage or blank starter
    let savedContent = null;
    let savedFilename = null;
    let savedTheme = "light";
    try {
      savedContent = localStorage.getItem(STORAGE_KEY);
      savedFilename = localStorage.getItem(STORAGE_FILENAME_KEY);
      savedTheme = localStorage.getItem(STORAGE_THEME_KEY) || "light";
    } catch {
      // Ignore storage access errors
    }

    setPreviewTheme(savedTheme);
    fileNameBadge.textContent = savedFilename || "untitled.md";
    editor.value = savedContent !== null ? savedContent : DEFAULT_MARKDOWN;
    renderMarkdown();
  </script>
</body>
</html>
